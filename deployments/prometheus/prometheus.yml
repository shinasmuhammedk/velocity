# Prometheus scrape configuration for local development.
#
# Both Velocity processes run on the host (go run ./cmd/api,
# go run ./cmd/worker) while Prometheus runs in Docker, so targets are
# addressed through host.docker.internal. On Linux this name is provided
# by the extra_hosts entry in docker-compose.yml.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

  external_labels:
    cluster: velocity-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: velocity-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9464
        labels:
          component: api

  - job_name: velocity-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9465
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090